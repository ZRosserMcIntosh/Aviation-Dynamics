name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cxx: g++
            flags: ""
          - name: linux-clang
            os: ubuntu-24.04
            cxx: clang++
            flags: ""
          - name: linux-gcc-sanitizers
            os: ubuntu-24.04
            cxx: g++
            flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          - name: macos-clang
            os: macos-14
            cxx: clang++
            flags: ""
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DAVD_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          AVD_VALIDATION_JSON: ${{ github.workspace }}/build/validation.json
        run: ctest --test-dir build --output-on-failure
      - name: Validation report
        run: ./build/avdemo validate
      # The validation tables in the docs are generated from the test output;
      # a stale table fails the build (regenerate with tools/update_validation_docs.py).
      - name: Generated validation docs are current
        if: matrix.name == 'linux-gcc'
        run: |
          python3 tools/update_validation_docs.py build/validation.json
          git diff --exit-code -- README.md docs web/README.md
      # Goldens (tests/golden/*.csv) are replayed by avd_tests; this prints the
      # full per-channel report when a trace differs or is missing.
      - name: Golden traces
        if: matrix.name == 'linux-gcc'
        run: ./build/tools/avdtrace --check || test $? -eq 2

  windows:
    name: windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  wasm:
    name: wasm (wasi-sdk 25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch wasi-sdk
        run: |
          curl -sSL -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          tar xzf wasi-sdk.tar.gz
          echo "WASI_SDK=$PWD/wasi-sdk-25.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build module
        run: sh web/build_wasi.sh
      - name: Smoke test
        run: node web/smoke_test.mjs
      - name: ABI version and README layout tables
        run: node web/abi_check.mjs
      - name: Bundle cockpit page
        run: node web/cockpit/build_page.mjs
      - name: Browser test (headless Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node web/cockpit/browser_test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: avd-web
          path: web/dist/

  fuzz:
    name: fuzz (loader, libFuzzer + ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja and clang
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-rt-dev
      - name: Configure
        run: >
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++ -DAVD_FUZZ=ON -DAVD_BUILD_TESTS=OFF -DAVD_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build-fuzz --target avd_fuzz_loader
      - name: Fuzz for a minute from the aircraft files
        run: |
          mkdir -p corpus && cp data/aircraft/*.json corpus/
          ./build-fuzz/avd_fuzz_loader corpus -max_total_time=60 -timeout=10 -rss_limit_mb=2048
